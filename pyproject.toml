[project]
name = "procurement-triage-service"
version = "0.1.0"
description = "Triagem de editais do PNCP: extração com citação verificável e fila ordenada por valor esperado."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "google-genai>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
